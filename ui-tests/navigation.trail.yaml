config:
  id: ferrostar/basic-navigation
  title: Basic navigation session
  args:
    maneuverPattern:
      type: string
      description: Regex for a later maneuver in the route fixture, shared by all platforms.
      default: ".*NJ 495.*"
    mobileStartPattern:
      type: string
      description: Start-navigation button text, ignoring capitalization differences between demos.
      default: "(?i)start navigation"
  devices:
    android:
      driver: ANDROID_ONDEVICE_ACCESSIBILITY
      locale: en-US
    ios:
      driver: IOS_HOST
      locale: en-US
    web:
      driver: PLAYWRIGHT_NATIVE
      locale: en-US

trail:
  - step: Open the demo with a simulated location and select the sample destination.
    recording:
      android:
        - android_grantPermissions:
            appId: com.stadiamaps.ferrostar.demo.uiexercise
            permissions:
              - android.permission.ACCESS_COARSE_LOCATION
              - android.permission.ACCESS_FINE_LOCATION
              - android.permission.POST_NOTIFICATIONS
        - launchApp:
            appId: com.stadiamaps.ferrostar.demo.uiexercise
            launchMode: FORCE_RESTART
        - assertVisibleBySelector:
            timeoutMs: 30000
            nodeSelector:
              androidAccessibility:
                textRegex: Choose Destination
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Choose Destination
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Sample destination
      ios:
        - ios_terminate:
            appId: com.stadiamaps.ferrostar.Demo
        - ios_grantPrivacy:
            appId: com.stadiamaps.ferrostar.Demo
            services:
              - location
        - openApp:
            appId: com.stadiamaps.ferrostar.Demo
        # Some simulator runtimes retain a pending first-launch alert despite the privacy grant.
        # The next required assertion still fails if anything prevents the demo from opening.
        - mobile_maestro:
            commands:
              - tapOn:
                  text: Allow While Using App
                  optional: true
        - assertVisibleBySelector:
            timeoutMs: 30000
            nodeSelector:
              iosMaestro:
                textRegex: Choose Destination
        - tapOnElementBySelector:
            nodeSelector:
              iosMaestro:
                textRegex: Choose Destination
        - tapOnElementBySelector:
            nodeSelector:
              iosMaestro:
                textRegex: Load Routes
        - assertVisibleBySelector:
            timeoutMs: 30000
            nodeSelector:
              iosMaestro:
                textRegex: Choose Route
        - tapOnElementBySelector:
            nodeSelector:
              iosMaestro:
                textRegex: Choose Route
      web:
        - web_resize:
            width: 1280
            height: 800
        - web_navigate:
            url: http://127.0.0.1:8765/?uiExercise
        - web_verifyElementVisible:
            nodeSelector:
              web:
                # Enabled only after MapLibre has loaded the style and initial tiles.
                cssSelector: "#simulate:enabled"

  # Wait immediately after starting, before slow UI captures can miss a transient maneuver.
  - step: Start navigation and wait for a later maneuver.
    recording:
      # Shared mobile commands; the web recording below overrides this default.
      all:
        - mobile_maestro:
            commands:
              - tapOn:
                  text: "{{args.mobileStartPattern}}"
              - extendedWaitUntil:
                  visible: "{{args.maneuverPattern}}"
                  timeout: 60000
      web:
        - web_click:
            nodeSelector:
              web:
                cssSelector: "#simulate"
        # Poll the live accessibility tree with the same regex and deadline as mobile.
        # The query reports matches; the count assertion makes an exhausted wait fail.
        - findSelectorMatches:
            timeoutMs: 60000
            selectors:
              - web:
                  ariaRole: paragraph
                  ariaNameRegex: "{{args.maneuverPattern}}"
        - assertMatchCount:
            min: 1
            nodeSelector:
              web:
                ariaRole: paragraph
                ariaNameRegex: "{{args.maneuverPattern}}"

  - step: Display the maneuver instruction and trip progress with navigation controls.
    recording:
      android:
        - assertVisibleBySelector:
            timeoutMs: 30000
            nodeSelector:
              androidAccessibility:
                contentDescriptionRegex: End Navigation
      ios:
        - assertVisibleBySelector:
            timeoutMs: 30000
            nodeSelector:
              iosMaestro:
                accessibilityTextRegex: Stop navigation
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: "instructions-view .instructions-view-card"
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: "trip-progress-view .progress-view-card"
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: "#stop-button"

  - step: Stop navigation and return to the destination selection controls.
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                contentDescriptionRegex: End Navigation
        - assertVisibleBySelector:
            timeoutMs: 10000
            nodeSelector:
              androidAccessibility:
                textRegex: Choose Destination
      ios:
        - tapOnElementBySelector:
            nodeSelector:
              iosMaestro:
                accessibilityTextRegex: Stop navigation
        - assertVisibleBySelector:
            timeoutMs: 10000
            nodeSelector:
              iosMaestro:
                textRegex: Choose Destination
      web:
        - web_click:
            nodeSelector:
              web:
                cssSelector: "#stop-button"
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: "#simulate:enabled"
