name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-android-build
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: android

    - uses: taiki-e/install-action@v2
      with:
        tool: just

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Touch local.properties (required for build)
      run: echo 'stadiaApiKey=' > local.properties
      working-directory: android

    - name: Run ktfmtCheck
      run: just format-android --check

    - name: Build with Gradle
      run: just build-android

    - name: Upload UI exercise app
      uses: actions/upload-artifact@v4
      with:
        name: ui-exercise-android-app
        path: android/demo-app/build/outputs/apk/uiExercise/demo-app-uiExercise.apk
        if-no-files-found: error
        retention-days: 5

  ui-exercise:
    name: UI exercise (${{ matrix.configuration }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ui-${{ matrix.configuration }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: android-pixel-6-en-us
            api-level: 34
            profile: pixel_6

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - uses: actions/download-artifact@v4
      with:
        name: ui-exercise-android-app
        path: ui-exercise-app

    - name: Exercise navigation and capture evidence
      uses: ./.github/actions/ui-exercise
      with:
        device: android
        configuration: ${{ matrix.configuration }}
        android-api-level: ${{ matrix.api-level }}
        android-profile: ${{ matrix.profile }}
        app: ui-exercise-app/demo-app-uiExercise.apk

  attach-ui-evidence:
    needs: ui-exercise
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ui-evidence.yml
    with:
      result: ${{ needs.ui-exercise.result }}

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-android-test
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: android

    - uses: taiki-e/install-action@v2
      with:
        tool: just

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Touch local.properties (required for cargo-ndk)
      run: echo 'stadiaApiKey=' > local.properties
      working-directory: android

    - name: Unit test
      run: just test-android-unit

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-reports
        path: |
          android/**/build/reports
        retention-days: 5

  verify-snapshots:

    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-android-snapshots
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: android

    - uses: taiki-e/install-action@v2
      with:
        tool: just

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Touch local.properties (required for cargo-ndk)
      run: echo 'stadiaApiKey=' > local.properties
      working-directory: android

    - name: Verify snapshots
      run: just test-android-snapshots

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: snapshot-reports
        path: |
          android/**/build/reports
          android/**/build/paparazzi
        retention-days: 5

  connected-check:

    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-android-connected-check
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: android

    - uses: taiki-e/install-action@v2
      with:
        tool: just

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Touch local.properties (required for build)
      run: echo 'stadiaApiKey=' > local.properties
      working-directory: android

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Connected Checks
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        avd-name: ubuntu-latest-x86_64-aosp-atd-30
        arch: x86_64
        target: aosp_atd
        script: just test-android-connected

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: connected-reports
        path: |
          android/**/build/reports
        retention-days: 5
