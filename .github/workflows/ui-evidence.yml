name: Attach UI evidence

on:
  workflow_call:
    inputs:
      result:
        description: Result of the UI exercise job.
        required: true
        type: string
  workflow_run:
    workflows: [iOS CI, Android CI, "WASM (JS)"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ui-evidence-${{ github.event.workflow_run.workflow_id || github.workflow }}-${{ github.event.workflow_run.head_branch || github.head_ref }}
  cancel-in-progress: false

jobs:
  attach:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.head_repository.full_name != github.repository ||
        github.event.workflow_run.actor.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fork and Dependabot completion events execute only default-branch code.
      # Same-repository PRs call this workflow directly, including before its first merge.
      # Neither path downloads or executes artifacts from the exercise jobs.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - uses: actions/github-script@v7
        env:
          EXERCISE_RESULT: ${{ inputs.result }}
        with:
          script: |
            const attach = require('./ui-tests/attach-evidence.cjs');
            await attach({github, context, core, result: process.env.EXERCISE_RESULT || undefined});
